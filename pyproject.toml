[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kwh-bench"
version = "1.0.0rc3"
description = "kWh Exchange Grade I benchmark: measures a rig's rate in reference jobs per hour."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "kWh Exchange" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kwh-bench = "kwh_bench.cli:main"

[tool.setuptools.packages.find]
include = ["kwh_bench*"]

[tool.setuptools.package-data]
kwh_bench = ["schema/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
